name: Fork Sync

permissions:
    contents: write

on:
    schedule:
        - cron: "0 0 * * *"  # 每天午夜执行
    workflow_dispatch:  # 允许手动触发

jobs:
    sync_with_upstream:
        name: Sync with Upstream
        runs-on: ubuntu-latest
        if: ${{ github.event.repository.fork }}

        steps:
            - name: Checkout target repo
              uses: actions/checkout@v5
              with:
                  fetch-depth: 0
                  token: ${{ secrets.GITHUB_TOKEN }}

            # GITHUB_TOKEN 是 GitHub App token，没有 workflows 权限，
            # 一旦上游改动 .github/workflows/* 就会 push 被拒（refusing to allow a GitHub App
            # to create or update workflow ... without workflows permission）。
            # 所以同步时保留本仓库自己的 workflow 文件，其余代码照常跟随上游。
            - name: Sync Upstream (skip workflow files)
              run: |
                  set -euo pipefail
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream https://github.com/huangxd-/danmu_api.git 2>/dev/null || true
                  git fetch --no-tags upstream main

                  merge_ok=1
                  git merge --no-commit --no-ff upstream/main || merge_ok=0

                  if [ "$merge_ok" -eq 0 ]; then
                      if [ -z "$(git rev-parse -q --verify MERGE_HEAD || true)" ]; then
                          echo "[Error] 与上游 merge 未启动（可能是历史不相关或 fetch 异常）"
                          exit 1
                      fi
                      bad=$(git ls-files -u | awk '{print $4}' | sort -u | grep -v '^\.github/workflows/' || true)
                      if [ -n "$bad" ]; then
                          echo "[Error] 以下非 workflow 文件存在冲突，需要人工处理："
                          echo "$bad"
                          git merge --abort || true
                          exit 1
                      fi
                      echo "仅 workflow 文件冲突，按本地版本消解"
                  fi

                  # 保留本地 workflow 文件（含已手动禁用的 docker-image.yml）
                  git checkout origin/main -- .github/workflows
                  git add -A

                  if git diff --cached --quiet; then
                      echo "已是最新，无需同步"
                      exit 0
                  fi

                  git commit -m "chore: sync with upstream $(date -u +%Y-%m-%d)"
                  for i in 1 2 3; do
                      if git push origin HEAD:main; then
                          echo "同步完成"
                          exit 0
                      fi
                      echo "push 失败，第 $i 次重试…"
                      sleep 5
                  done
                  exit 1

            - name: Check for Failure
              if: failure()
              run: |
                  echo "[Error] Sync failed. This might be due to:"
                  echo "1. 上游改动了 .github/workflows 之外的同名文件导致冲突"
                  echo "2. Network issues"
                  exit 1
